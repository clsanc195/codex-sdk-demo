# Project-scoped Codex configuration for the change-risk demo.
# Codex loads a project .codex/config.toml only for projects you have trusted.
# The demo service also reads this same file and passes [mcp_servers] to the SDK,
# so there is one source of truth for the tool wiring.

[mcp_servers.change_policy]
# STDIO server: Codex starts this process itself.
command = ".venv/bin/python"
args = ["mcp_server/change_policy_server.py"]
startup_timeout_sec = 20
tool_timeout_sec = 45

# Allow list: only these tools are exposed to the agent.
enabled_tools = ["get_change_request", "get_service_profile", "search_policies"]

# The service runs with nobody at a prompt, so pre-approve these read-only tools.
default_tools_approval_mode = "approve"

